# Confirm Aeneas extraction succeeds

name: Aeneas extraction

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  extract:
    name: Check Aeneas Extraction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl pkg-config libgmp-dev protobuf-compiler

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm ci

      - name: Check installer TypeScript
        run: npm run typecheck

      - name: Select pinned release
        id: installation
        run: |
          node --import tsx --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { loadConfig } from './scripts/lib/config.ts';
          const { config } = loadConfig();
          if (config.aeneas.mode !== 'release') throw new Error('Extraction CI requires release mode');
          console.log(`identity=${config.aeneas.release.tag}`);
          JS
          # The hosted Ubuntu runner supplies rustup; the installer selects its exact driver channel.
          rustup --version

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache pinned paired installation
        uses: actions/cache@v5
        with:
          path: |
            .aeneas/releases
          key: ${{ runner.os }}-${{ runner.arch }}-aeneas-v1-release-${{ steps.installation.outputs.identity }}-${{ hashFiles('rust/aeneas-config.yml', 'lakefile.toml') }}

      - name: Install Aeneas release
        run: npm run aeneas-install -- --release

      - name: Extract to Lean
        run: npm run aeneas-extract

      - name: Check for modifications in generated files
        run: |
          if git diff --exit-code; then
            echo "Generated files match committed versions"
          else
            echo "Generated files differ from committed versions"
            echo ""
            echo "Run 'npm run aeneas-extract' locally and commit the results."
            exit 1
          fi
