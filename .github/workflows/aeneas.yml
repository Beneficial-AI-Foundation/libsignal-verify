# Confirm Aeneas extraction succeeds

name: Aeneas extraction

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  extract:
    name: Check Aeneas Extraction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl python3 pkg-config libgmp-dev protobuf-compiler

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm ci

      - name: Check installer TypeScript
        run: npm run typecheck

      - name: Select pinned installation
        id: installation
        run: |
          node --import tsx --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { loadConfig } from './scripts/lib/config.ts';
          const { config } = loadConfig();
          console.log(`mode=${config.aeneas.mode}`);
          console.log(`identity=${config.aeneas.mode === 'release' ? config.aeneas.release.tag : config.aeneas.commit}`);
          JS

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Source builds need opam. Release mode uses prebuilt Aeneas/Charon tools.
      - name: Initialize source-build dependencies
        if: steps.installation.outputs.mode == 'source'
        run: |
          sudo apt-get install -y opam
          opam init --disable-sandboxing -y -a

      - name: Cache OCaml environment (source mode only)
        if: steps.installation.outputs.mode == 'source'
        uses: actions/cache@v5
        with:
          path: ~/.opam
          key: ${{ runner.os }}-${{ runner.arch }}-opam-v1-${{ steps.installation.outputs.identity }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache pinned paired installation
        uses: actions/cache@v5
        with:
          path: |
            .aeneas/releases
            .aeneas/sources
          key: ${{ runner.os }}-${{ runner.arch }}-aeneas-v1-${{ steps.installation.outputs.mode }}-${{ steps.installation.outputs.identity }}-${{ hashFiles('rust/aeneas-config.yml') }}

      - name: Install Aeneas (explicit selected mode)
        run: npm run aeneas-install -- --${{ steps.installation.outputs.mode }}

      - name: Extract to Lean
        run: npm run aeneas-extract

      - name: Check for modifications in generated files
        run: |
          if git diff --exit-code; then
            echo "Generated files match committed versions"
          else
            echo "Generated files differ from committed versions"
            echo ""
            echo "Run 'npm run aeneas-extract' locally and commit the results."
            exit 1
          fi
