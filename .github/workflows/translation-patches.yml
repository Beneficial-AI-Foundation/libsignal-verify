# Check that the committed rust/ tree is upstream libsignal and that the translation
# patches apply. The extraction workflow (aeneas.yml) checks that the patched tree
# reproduces the committed Lean translation.

name: Translation patches check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  patches:
    name: Check translation patches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check rust/ is upstream and the patches apply
        run: npm run patches-check
