<svg xmlns="http://www.w3.org/2000/svg" class="probtree" viewBox="0 0 600 270" role="img" aria-labelledby="t2-title t2-desc" style="width:100%;max-width:600px">
  <title id="t2-title">The tree of t₂</title>
  <desc id="t2-desc">A draw node for x with two outcomes. Under each outcome there is a draw node for y with two outcomes. The four leaves are (false, false), (false, true), (true, false) and (true, true), from left to right.</desc>
  <style>
    svg.probtree .edge { stroke: var(--bp-color-border-strong, #94a3b8); stroke-width: 2; fill: none; }
    svg.probtree .draw { fill: var(--bp-color-surface-muted, #f8fafc); stroke: var(--bp-color-accent-info, #7c3aed); stroke-width: 2; }
    svg.probtree .leaf { fill: var(--bp-color-surface, #ffffff); stroke: var(--bp-color-accent-success, #16a34a); stroke-width: 2; }
    svg.probtree text { font-family: inherit; fill: var(--bp-color-text-strong, #0f172a); }
    svg.probtree .name { font-size: 15px; text-anchor: middle; }
    svg.probtree .value { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; text-anchor: middle; }
    svg.probtree .outcome { font-size: 13px; fill: var(--bp-color-text-subtle, #475569); }
  </style>
  <g class="edge">
    <line x1="300" y1="58" x2="150" y2="124"/>
    <line x1="300" y1="58" x2="450" y2="124"/>
    <line x1="150" y1="158" x2="75" y2="230"/>
    <line x1="150" y1="158" x2="225" y2="230"/>
    <line x1="450" y1="158" x2="375" y2="230"/>
    <line x1="450" y1="158" x2="525" y2="230"/>
  </g>
  <text class="outcome" x="220" y="88" text-anchor="end">x = 0</text>
  <text class="outcome" x="380" y="88" text-anchor="start">x = 1</text>
  <text class="outcome" x="106" y="192" text-anchor="end">y = 0</text>
  <text class="outcome" x="194" y="192" text-anchor="start">y = 1</text>
  <text class="outcome" x="406" y="192" text-anchor="end">y = 0</text>
  <text class="outcome" x="494" y="192" text-anchor="start">y = 1</text>
  <rect class="draw" x="255" y="24" width="90" height="34" rx="10"/>
  <text class="name" x="300" y="46">draw x</text>
  <rect class="draw" x="105" y="124" width="90" height="34" rx="10"/>
  <text class="name" x="150" y="146">draw y</text>
  <rect class="draw" x="405" y="124" width="90" height="34" rx="10"/>
  <text class="name" x="450" y="146">draw y</text>
  <rect class="leaf" x="10" y="230" width="130" height="32"/>
  <text class="value" x="75" y="251">(false, false)</text>
  <rect class="leaf" x="160" y="230" width="130" height="32"/>
  <text class="value" x="225" y="251">(false, true)</text>
  <rect class="leaf" x="310" y="230" width="130" height="32"/>
  <text class="value" x="375" y="251">(true, false)</text>
  <rect class="leaf" x="460" y="230" width="130" height="32"/>
  <text class="value" x="525" y="251">(true, true)</text>
</svg>
