# Aeneas extraction — shared / repo-level configuration.
#
# This base file holds settings common to every crate. The per-crate files
# (aeneas-config.protocol.yml, aeneas-config.core.yml, aeneas-config.crypto.yml)
# are merged on top of it by scripts/lib/config.ts; select one with the crate
# arg to `npm run aeneas-extract`, e.g. `npm run aeneas-extract:protocol`.

aeneas:
  # The executable and Lake/Lean backend must use the same release revision.
  mode: release
  commit: "ab34bd28458a08c150b7cbf1873e59af74588138"
  repo: "https://github.com/AeneasVerif/aeneas.git"
  release:
    # The release tag is selected by the Aeneas requirement in lakefile.toml.
    commit: "ab34bd28458a08c150b7cbf1873e59af74588138"
    charon_commit: "7b462d9159db2ed3015162352183906a30bfafc6"
    lean: "leanprover/lean4:v4.35.0"
    rust_channel: "nightly-2026-09-17"
    assets:
      darwin-arm64:
        sha256: "e10a92d89b434a654dde1f31c2a66119134260341f9a3763ab63ffe613ad6f98"
      linux-x64:
        sha256: "ed0e336c506dad37e4e1c53f6cc4d6d5959d7e3afab2fd55aead280775651f5e"
      linux-arm64:
        sha256: "d35d0cfd5ebf9aa158bd312f2cf3a8076a691f27b08605f6664dfdb705ad175e"

upstream:
  repo: "https://github.com/signalapp/libsignal"
  commit: "e8cc2dddd578859b4a029c9c94670b24ce2b616a"

# The committed rust/ tree is upstream at the commit above. The source changes made for
# extraction are one patch per item in this folder; scripts/aeneas-extract.ts applies them
# to a work copy (.aeneas/work/) and runs Charon there. See translation-patches/README.md.
patches_dir: "translation-patches"

charon:
  # Use the distributed Rust sysroot rather than rebuilding std with full MIR.
  sysroot: default

aeneas_args:
  # Match the import format of the maintained external models and specifications.
  use_lean_modules: false

crate:
  dir: "rust"
