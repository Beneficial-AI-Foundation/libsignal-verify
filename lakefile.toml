name = "Libsignal"
version = "0.1.0"
defaultTargets = ["Translation", "Libsignal"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxRecDepth = 10000

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
subDir = "backends/lean"
rev = "ce1708e"

# All three per-crate translations + their shared externals, under Translation/.
[[lean_lib]]
name = "Translation"

# Hand-written specifications / proofs.
[[lean_lib]]
name = "Libsignal"
