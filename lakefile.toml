name = "Libsignal"
version = "0.1.0"
defaultTargets = ["Libsignal", "Protocols", "ProtocolsTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxRecDepth = 10000

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
subDir = "backends/lean"
rev = "nightly-2026.09.30-0855ce1"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCV-io"
rev = "cbd4144b51d92da00dd50f05e068b2348fa6e529"

# The Aeneas translations + their shared externals (Libsignal.Translated.*) and
# the hand-written specifications / proofs (Libsignal.Spec.*), all under rust/Libsignal/.
[[lean_lib]]
name = "Libsignal"
srcDir = "rust"

[[lean_lib]]
name = "Protocols"

# Fixtures and tests for the Protocols library, kept out of the library itself.
[[lean_lib]]
name = "ProtocolsTest"
