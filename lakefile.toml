name = "Libsignal"
version = "0.1.0"
defaultTargets = ["Libsignal"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxRecDepth = 10000

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
subDir = "backends/lean"
rev = "ce1708e"

# The Aeneas translations + their shared externals (Libsignal.Translated.*) and
# the hand-written specifications / proofs (Libsignal.Spec.*), all under rust/Libsignal/.
[[lean_lib]]
name = "Libsignal"
srcDir = "rust"
