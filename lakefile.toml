name = "Libsignal"
version = "0.1.0"
defaultTargets = ["Libsignal", "Protocols", "ProtocolsTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxRecDepth = 10000

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
subDir = "backends/lean"
rev = "nightly-2026.10.30-de16f3c"

# VCVio tag v4.35.0.
[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCV-io"
rev = "88efe9715a9fa9e7d89635c38cf70259836766c2"

# The Aeneas translations + their shared externals (Libsignal.Translated.*), the
# hand-written specifications / proofs (Libsignal.Proofs.*) and their spec summaries
# (Libsignal.Specs.*), all under rust/Libsignal/.
[[lean_lib]]
name = "Libsignal"
srcDir = "rust"

[[lean_lib]]
name = "Protocols"

# Fixtures and tests for the Protocols library, kept out of the library itself.
[[lean_lib]]
name = "ProtocolsTest"
