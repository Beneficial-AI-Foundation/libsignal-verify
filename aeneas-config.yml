# Aeneas extraction configuration — libsignal-protocol
#

aeneas:
  commit: "5138c03"
  repo: "https://github.com/AeneasVerif/aeneas.git"

upstream:
  repo: "https://github.com/signalapp/libsignal"
  commit: "46d867c9"

crate:
  dir: "rust"
  name: "libsignal_protocol"

charon:
  cargo_args: ["-p", "libsignal-protocol", "--features", "extraction"]
  # Detail of charon's per-item translation timings written to .logs/charon.log.
  #   full → all spans incl. nested trait-proof/type/fn-ptr. IMPRACTICAL at scale:
  #          Debug-formats giant nested-trait-proof ItemRef{…} per span, which is
  #          pathologically slow on trait-heavy fns. Use only for a 1-item deep-dive.
  #   item → per-item durations + live current-item, no giant-ItemRef formatting.
  #   off  → no profiling (plain echoed log).
  profile: off
  # start_from_pub: true
  start_from:
    - "libsignal_protocol::pqxdh"
    - "libsignal_protocol::consts" #16
    - "libsignal_protocol::crypto" #15
    - "libsignal_protocol::identity_key" #14
    - "libsignal_protocol::timestamp" #13
    # DEFERRED: incremental_mac::update returns `impl Iterator<Item=Output<M>> + 'a`
    # - "libsignal_protocol::incremental_mac"
    - "libsignal_protocol::ratchet" #12
    - "libsignal_protocol::state" #11
    - "libsignal_protocol::fingerprint" #10
    - "libsignal_protocol::sender_keys" #9
    - "libsignal_protocol::protocol" #8
    - "libsignal_protocol::double_ratchet" #7
    - "libsignal_protocol::triple_ratchet" #6
    # group_cipher + session are SOURCE-GATED out under `feature="extraction"` 
    # - "libsignal_protocol::group_cipher"
    # - "libsignal_protocol::session"
    - "libsignal_protocol::session_management" #5
    # ── Parity with `main` (which targeted signal_crypto + start_from_pub and an
    # explicit libsignal_core list). The protocol root doesn't reach all of these as
    # deps, so root them explicitly to keep the extraction a strict SUPERSET of main
    # (never extract fewer functions than before). signal_crypto: main rooted all its
    # pub items via start_from_pub; replicate by rooting its modules.
    - "libsignal_core::try_scoped"
    # derive_arrays: `#[inline]` wrapper over (opaqued) try_derive_arrays; main rooted
    # it but never emitted it (not in main's Funs/FunsExternal). Rooting it here hits an
    # Aeneas "Internal error" on its closure + irrefutable `let Ok(_) =` (Infallible).
    # Not needed for parity, so don't root it.
    # - "libsignal_core::derive_arrays"
    - "libsignal_core::try_derive_arrays"
    - "libsignal_core::version::VERSION"
    - "libsignal_core::e164::_::new"
    - "libsignal_core::e164::_::to_be_bytes"
    - "libsignal_core::e164::_::from_be_bytes"
    - "libsignal_core::address::_::new"
    - "libsignal_core::address::_::new_nonzero"
    - "libsignal_core::address::_::kind"
    - "libsignal_core::address::_::service_id_binary"
    - "libsignal_core::address::_::service_id_fixed_width_binary"
    - "libsignal_core::address::_::parse_from_service_id_binary"
    - "libsignal_core::address::_::parse_from_service_id_fixed_width_binary"
    - "libsignal_core::address::_::raw_uuid"
    - "libsignal_core::address::_::from_uuid_bytes"
    - "libsignal_core::address::_::from_uuid"
    - "libsignal_core::address::_::name"
    - "libsignal_core::address::_::device_id"
    - "libsignal_core::curve::_::deserialize"
    - "libsignal_core::curve::_::serialize"
    - "libsignal_core::curve::_::key_type"
    - "libsignal_core::curve::_::public_key"
    - "libsignal_core::curve::_::public_key_bytes"
    - "libsignal_core::curve::_::from_djb_public_key_bytes"
    - "libsignal_core::curve::_::verify_signature"
    - "libsignal_core::curve::_::verify_signature_for_multipart_message"
    - "libsignal_core::curve::_::is_canonical"
    - "libsignal_core::curve::_::calculate_signature"
    - "libsignal_core::curve::_::calculate_signature_for_multipart_message"
    - "libsignal_core::curve::_::calculate_agreement"
    - "libsignal_core::curve::_::generate"
    - "libsignal_core::curve::_::from_public_and_private"
    - "signal_crypto::aes_cbc"
    - "signal_crypto::aes_ctr"
    - "signal_crypto::aes_gcm"
    - "signal_crypto::hash"
    # NOTE: signal_crypto's AEAD struct methods (Aes256Gcm{Enc,Dec}ryption::{encrypt,
    # decrypt,compute_tag,verify_tag}, CryptographicMac::update_and_get) and the typenum
    # trait instances that came with them appear in main only because main *targeted*
    # signal_crypto (start_from_pub roots every pub item of the target crate). Here
    # signal_crypto is merely --include'd, so Charon emits only items reachable from the
    # protocol roots. These structs are unreachable from rust/protocol/src (sealed_sender
    # uses the external aes_gcm_siv crate, not signal_crypto's Aes256GcmEncryption), and
    # an explicit --start-from of an unreachable included-crate struct method is a no-op
    # (produces no def, no error). They are therefore out of scope for this extraction.
    # DEFERRED: `sealed_sender` causes Charon to be very slow
    # - "libsignal_protocol::sealed_sender" #4
    # DEFERRED: storage is `#[async_trait]` store traits (SessionStore, ...) +
    # - "libsignal_protocol::storage"
    # DEFERRED: session_cipher_legacy triggers a charon-driver (hax) panic on the
    # kem DynParameters `&mut dyn CryptoRng` blanket-impl methods 
    # - "libsignal_protocol::session_cipher_legacy"
  include:
    - "libsignal_core" #1
    - "signal_crypto" #2
  exclude:
    # Formatting and error trait impls (not needed for verification)
    - "libsignal_protocol::{impl core::fmt::Debug for _}"
    - "libsignal_protocol::{impl core::fmt::Display for _}"
    - "libsignal_protocol::_::{impl core::fmt::Debug for _}"
    - "libsignal_protocol::_::{impl core::fmt::Display for _}"
    - "libsignal_protocol::_::_::{impl core::fmt::Debug for _}"
    - "libsignal_protocol::_::_::{impl core::fmt::Display for _}"
    # Deeper Debug/Display impls under the prost-generated proto module (nested
    # messages create modules 3-5 deep, e.g. proto::sealed_sender::
    # unidentified_sender_message::{impl Debug for Message}). Their custom fmt
    # bodies contain nested ScalarWrapper/Inner helper impls that name-clash and
    # emit "no bottoms" in Aeneas. The crate-wide patterns above only reach depth 2.
    - "libsignal_protocol::proto::_::_::{impl core::fmt::Debug for _}"
    - "libsignal_protocol::proto::_::_::{impl core::fmt::Display for _}"
    - "libsignal_protocol::proto::_::_::_::{impl core::fmt::Debug for _}"
    - "libsignal_protocol::proto::_::_::_::{impl core::fmt::Display for _}"
    - "libsignal_protocol::proto::_::_::_::_::{impl core::fmt::Debug for _}"
    - "libsignal_protocol::proto::_::_::_::_::{impl core::fmt::Display for _}"
    - "libsignal_protocol::{impl core::error::Error for _}"
    - "libsignal_protocol::_::{impl core::error::Error for _}"
    - "libsignal_core::{impl core::fmt::Debug for _}"
    - "libsignal_core::{impl core::fmt::Display for _}"
    - "libsignal_core::_::{impl core::fmt::Debug for _}"
    - "libsignal_core::_::{impl core::fmt::Display for _}"
    - "libsignal_core::_::_::{impl core::fmt::Debug for _}"
    - "libsignal_core::_::_::{impl core::fmt::Display for _}"
    - "libsignal_core::{impl core::error::Error for _}"
    - "libsignal_core::_::{impl core::error::Error for _}"
    - "signal_crypto::{impl core::fmt::Debug for _}"
    - "signal_crypto::{impl core::fmt::Display for _}"
    - "signal_crypto::_::{impl core::fmt::Debug for _}"
    - "signal_crypto::_::{impl core::fmt::Display for _}"
    - "signal_crypto::_::_::{impl core::fmt::Debug for _}"
    - "signal_crypto::_::_::{impl core::fmt::Display for _}"
    - "signal_crypto::{impl core::error::Error for _}"
    - "signal_crypto::_::{impl core::error::Error for _}"
    # group_cipher high-level `async fn` API — async desugars to `impl Future`
    # (RPIT) which opaque can't represent; exclude (invisible). Top-level API,
    # nothing internal references them.
    - "libsignal_protocol::group_cipher::group_encrypt"
    - "libsignal_protocol::group_cipher::group_decrypt"
    - "libsignal_protocol::group_cipher::process_sender_key_distribution_message"
    - "libsignal_protocol::group_cipher::create_sender_key_distribution_message"
    # session / session_management high-level `async fn` API (Future state machines)
    - "libsignal_protocol::session_management::message_encrypt"
    - "libsignal_protocol::session_management::message_decrypt"
    - "libsignal_protocol::session_management::message_decrypt_prekey"
    - "libsignal_protocol::session_management::message_decrypt_signal"
    - "libsignal_protocol::session::process_prekey"
    - "libsignal_protocol::session::process_prekey_impl"
    - "libsignal_protocol::session::process_prekey_bundle"
    # sealed_sender high-level `async fn` API (Future state machines)
    - "libsignal_protocol::sealed_sender::sealed_sender_encrypt"
    - "libsignal_protocol::sealed_sender::sealed_sender_encrypt_from_usmc"
    - "libsignal_protocol::sealed_sender::sealed_sender_decrypt"
    - "libsignal_protocol::sealed_sender::sealed_sender_decrypt_to_usmc"
    - "libsignal_protocol::sealed_sender::sealed_sender_multi_recipient_encrypt"
    - "libsignal_protocol::sealed_sender::sealed_sender_multi_recipient_encrypt_impl"
    # sealed_sender deserialize methods: `[u8; ASSOCIATED_CONST]` array-default in
    # the local PrefixRepr (UnidentifiedSenderMessage::deserialize) FATALLY crashes
    # Aeneas's update_array_default prepass. Opaque doesn't help (the prepass runs
    # over the LLBC before opacity applies), so exclude it entirely. Its callers are
    # the gated/opaqued decrypt+parse paths, so nothing transparent dangles.
    - "libsignal_protocol::sealed_sender::_::deserialize"
    # should_use_nonpq_session takes an `f64` ratio → Lean `F64`, a type the Aeneas
    # Lean backend NAMES (ExtractBase.ml float_name) but never DEFINES, so the axiom
    # won't typecheck. It's a standalone `pub fn` rooted only by `--start-from
    # ...::protocol` (module-rooting); its sole callers are tests + the bridge layer
    # (external), so nothing in scope references it.
    - "libsignal_protocol::protocol::should_use_nonpq_session"
    # Iterator-adaptor users: build `Map`/`position` iterators, but Aeneas's base
    # `core.iter.traits.iterator.Iterator` (Aeneas/Std/Core/Iter.lean) only models
    # {next, step_by, enumerate, take} — NOT `map`/`position` — so the generated
    # `Map` Iterator instance has fields the base struct lacks ("not a field" / "fields
    # missing"). Both are `pub(crate)` and their ONLY callers live in source-gated-out
    # modules (chain_ids_for_logging ← group_cipher; promote_matching_session ←
    # session), so they're module-rooted dead weight — exclude (nothing in scope
    # references them). chain_ids_for_logging also returns `impl ExactSizeIterator`
    # (RPIT), which opaque can't represent anyway.
    - "libsignal_protocol::sender_keys::_::chain_ids_for_logging"
    - "libsignal_protocol::state::session::_::promote_matching_session"
    # set_unacknowledged_kyber_pre_key_id: `pub(crate)`, only caller is
    # session::process_prekey_bundle (in the source-gated-out `session` module), so
    # module-rooted dead weight. Its body destructures `Option::as_mut(...).expect(...)`
    # as an `&mut` writeback pair on a proto type, which Aeneas mis-models ("expected
    # a product type, got PendingKyberPreKey"). Nothing in scope references it → exclude.
    - "libsignal_protocol::state::session::_::set_unacknowledged_kyber_pre_key_id"
    # kem::KeyType::parameters returns `&'static dyn DynParameters` — excluded
    # (invisible) so its `&dyn` signature is never translated and the
    # DynParameters trait + blanket impl (with `&mut dyn CryptoRng`) are never
    # pulled. Its only callers (key_length, KeyPair::generate) are opaque, so
    # nothing references it transparently. (`_::` = inherent-method form.)
    - "libsignal_protocol::kem::_::parameters"
    # Crate-level excludes
    - "libsignal_core::curve::curve25519" # Charon panic in curve25519_dalek
    - "core::str::pattern"                # GATs unsupported by Aeneas
    - "rand::distr::uniform"              # mutually recursive traits
    - "zerocopy"                          # raw pointer ops, GATs
    - "log"
    # ── Deferred modules ─────────────────────────────────────────────────
    # With no explicit start_from (open scope), charon reaches the WHOLE crate,
    # including these three modules we previously kept out simply by not listing
    # them. They fail Aeneas for known, intrinsic reasons, and no kept code depends
    # on them transparently (the curated allow-list ran fine without them), so we
    # exclude them outright now that the scope is open.
    - "libsignal_protocol::incremental_mac"     # update() returns `impl Iterator + 'a` (RPIT+lifetime) → "Unexpected erased region"
    - "libsignal_protocol::storage"             # async store traits (SessionStore, …) + InMem test impls — charon can't translate async traits → dangling trait ids
    - "libsignal_protocol::session_cipher_legacy" # reaches kem DynParameters `&mut dyn CryptoRng` + async store traits
  opaque:
    # Protobuf message impls (generated from signal.proto.*). Open scope translates
    # every generated `impl prost::Message` BODY → prost encode/decode → Aeneas
    # errors (Arrow types in prost). OPAQUE (not exclude) the Message impls: the
    # impl stays present as an axiom so transparent callers (e.g. sealed_sender's
    # `.encode_to_vec()`) still resolve, while the prost-heavy body is skipped. The
    # message structs themselves stay transparent (kept code reads their fields).
    # NB: matcher uses the trait's DEFINING path `prost::message::Message` (the
    # `prost::Message` re-export path does NOT match). Patterns cover each nesting
    # depth prost emits for nested messages.
    - "libsignal_protocol::proto::_::{impl prost::message::Message for _}"
    - "libsignal_protocol::proto::_::_::{impl prost::message::Message for _}"
    - "libsignal_protocol::proto::_::_::_::{impl prost::message::Message for _}"
    - "libsignal_protocol::proto::_::_::_::_::{impl prost::message::Message for _}"
    # libsignal-protocol::pqxdh — bodies Aeneas can't model:
    # HKDF closures and Option<&T> accessors. (The Handshake trait + its
    # impl are excluded at source level via #[charon::exclude] —
    # see rust/protocol/src/{handshake.rs, pqxdh.rs}.)
    - "libsignal_protocol::pqxdh::_::derive"                 # HKDF closure
    - "libsignal_protocol::pqxdh::_::derive_with_label"      # HKDF closure
    - "libsignal_protocol::pqxdh::_::their_one_time_pre_key" # Option<&PublicKey>
    - "libsignal_protocol::pqxdh::_::our_one_time_pre_key_pair" # Option<&KeyPair>
    # libsignal-protocol::kem — Plan A scope:
    # encapsulate, decapsulate, Ciphertext::serialize/deserialize are
    # TRANSPARENT (their bodies are extracted; the libcrux ML-KEM primitive is
    # the axiomatic leaf). Everything else in kem.rs that touches the
    # `DynParameters` vtable becomes opaque — these aren't called from the
    # PQXDH verification target.
    - "libsignal_protocol::kem::_::key_length"            # KeyKind::key_length impls (Public, Secret) use parameters()
    - "libsignal_protocol::kem::_::generate"              # KeyPair::generate uses parameters().generate() (inherent-method `_::` form)
    # libcrux ML-KEM 1024 primitive — the axiomatic leaf (FIPS 203).
    - "libsignal_protocol::kem::kyber1024::_::encapsulate"
    - "libsignal_protocol::kem::kyber1024::_::decapsulate"
    - "libsignal_protocol::kem::kyber1024::_::generate"
