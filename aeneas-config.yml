    - "libsignal_protocol::state::signed_prekey::GenericSignedPreKey::deserialize"
    # libsignal_core::curve — Curve25519 (curve25519_dalek) crypto primitives:
    # DH, keygen, sign/verify, deserialize (log macro). Axiomatic crypto leaves.
    - "libsignal_core::curve::_::deserialize"
    - "libsignal_core::try_derive_arrays"
    # libsignal-core functions that use unsupported features
    - "libsignal_core::address::_::service_id_string"       # uses format! macro
    - "libsignal_core::address::_::parse_from_service_id_string" # uses str::Pattern (GAT)
    - "libsignal_core::address::_::to_protocol_address"      # calls service_id_string
    - "libsignal_core::curve::_::public_key"
    - "libsignal_core::curve::_::generate"
    - "libsignal_core::curve::_::calculate_agreement"
    - "libsignal_core::curve::_::calculate_signature"
    - "libsignal_core::curve::_::calculate_signature_for_multipart_message"
    - "libsignal_core::curve::_::verify_signature"
    - "libsignal_core::curve::_::verify_signature_for_multipart_message"
    - "libsignal_core::curve::_::is_torsion_free"
    - "libsignal_core::curve::_::try_from"
    # signal_crypto — AES-CBC/CTR/GCM + hash wrappers over external crypto crates.
    - "signal_crypto::aes_cbc::aes_256_cbc_encrypt"
    - "signal_crypto::aes_cbc::aes_256_cbc_decrypt"
    - "signal_crypto::aes_ctr::_::new"
    - "signal_crypto::aes_ctr::_::from_key"
    - "signal_crypto::aes_ctr::_::process"
    - "signal_crypto::aes_gcm::_::new"
    - "signal_crypto::aes_gcm::_::update"
    - "signal_crypto::aes_gcm::_::finalize"
    - "signal_crypto::aes_gcm::setup_gcm"
    - "signal_crypto::hash::_::new"
    - "signal_crypto::hash::_::update"
    - "signal_crypto::hash::_::finalize"
    # libsignal_core::address — opaque (NOT exclude): these are *called* by
    # protocol fns (is_same_account, serialize_addresses), so excluding them
    # dangles. The str::Pattern GAT / format! is only in the body; signatures
    # (&str -> Option<Self> / -> String) are clean, so opaque works.
    - "libsignal_core::address::_::service_id_string"            # format! macro
    - "libsignal_core::address::_::parse_from_service_id_string" # str::Pattern (GAT)
    - "libsignal_core::address::_::to_protocol_address"          # calls service_id_string

aeneas_args:
  options:
    - split-files
  dest: "."
  subdir: "Libsignal/Code"

tweaks:
  # Only auto-generated files. TypesExternal.lean / FunsExternal.lean are
  # hand-maintained (not regenerated), so tweaks must never touch them.
  files: ["TypesExternal_Template.lean", "Types.lean", "FunsExternal_Template.lean", "Funs.lean"]
  substitutions:
    # Disable linters for auto-generated files
    - find: |
        set_option linter.unusedVariables false
      replace: |
        set_option linter.unusedVariables false
        set_option linter.style.longLine false
        set_option linter.style.setOption false
        set_option linter.style.whitespace false

    # Fix Aeneas codegen: scalar Eq generates = (Prop) instead of == (Bool)
    # https://github.com/AeneasVerif/aeneas/issues/920
    - find: "then ok (i = 127#u8)"
      replace: "then ok (i == 127#u8)"

    # Duplicate parentClauses name when two supertraits are the same trait:
    # `core::num::nonzero::ZeroablePrimitive` gets two `markerCopyInst` fields
    # (Copy Self and Copy Self_NonZeroInner). Rename the 2nd consistently in the
    # structure decl, its `parentClauses` attr, and the (sole) NonZeroU8Inner
    # instance. No projections reference it, so the rename is sound.
    # https://github.com/AeneasVerif/aeneas/issues/1051
    - find: '["markerCopyInst", "privateSealedInst", "markerCopyInst"]'
      replace: '["markerCopyInst", "privateSealedInst", "markerCopyInst1"]'
    - find: "markerCopyInst : core.marker.Copy Self_NonZeroInner"
      replace: "markerCopyInst1 : core.marker.Copy Self_NonZeroInner"
    - find: "markerCopyInst := core.num.niche_types.NonZeroU8Inner.Insts.CoreMarkerCopy"
      replace: "markerCopyInst1 := core.num.niche_types.NonZeroU8Inner.Insts.CoreMarkerCopy"
    # Same #1051 dup for NonZero<u64> (pulled in by the signal_crypto roots). The
    # generic ZeroablePrimitive structure decl + parentClauses are shared (fixed above);
    # only the per-instance construction needs the U64 variant.
    - find: "markerCopyInst := core.num.niche_types.NonZeroU64Inner.Insts.CoreMarkerCopy"
      replace: "markerCopyInst1 := core.num.niche_types.NonZeroU64Inner.Insts.CoreMarkerCopy"

    # KeyPairSerde has two `KeySerde` parent clauses (one per associated type,
    # PublicKey and PrivateKey) which Aeneas names identically `KeySerdeInst`
    # (#1051). Rename the two STRUCTURE FIELDS after the associated type each bound
    # constrains — PublicKey / PrivateKey — to match the Rust source and make the
    # public/private distinction explicit. Disambiguated by the `Self_PublicKey` /
    # `Self_PrivateKey` type arg, so these match ONLY the declaration lines (not the
    # `:=` construction or `.KeySerdeInst.` projections in Funs.lean).
    # https://github.com/AeneasVerif/aeneas/issues/1051
    # (a) structure decl fields (disambiguated by the Self_PublicKey/Self_PrivateKey arg):
    - find: "KeySerdeInst : state.signed_prekey.KeySerde Self_PublicKey"
      replace: "PublicKey : state.signed_prekey.KeySerde Self_PublicKey"
    - find: "KeySerdeInst : state.signed_prekey.KeySerde Self_PrivateKey"
      replace: "PrivateKey : state.signed_prekey.KeySerde Self_PrivateKey"
    # (b) instance CONSTRUCTION (`KeySerdeInst := <value>`): classify by the value —
    # KeyPublic/curve.PublicKey → PublicKey; KeySecret/curve.PrivateKey → PrivateKey.
    - regex: 'KeySerdeInst :=(\s+)kem\.KeyPublic\.Insts'
      replace: 'PublicKey :=$1kem.KeyPublic.Insts'
    - regex: 'KeySerdeInst :=(\s+)kem\.KeySecret\.Insts'
      replace: 'PrivateKey :=$1kem.KeySecret.Insts'
    - regex: 'KeySerdeInst :=(\s+)libsignal_core\.curve\.PublicKey\.Insts'
      replace: 'PublicKey :=$1libsignal_core.curve.PublicKey.Insts'
    - regex: 'KeySerdeInst :=(\s+)libsignal_core\.curve\.PrivateKey\.Insts'
      replace: 'PrivateKey :=$1libsignal_core.curve.PrivateKey.Insts'
    # (c) PROJECTIONS. deserialize always reads `spkrs.public_key` → PublicKey.
    - find: ".KeySerdeInst.deserialize"
      replace: ".PublicKey.deserialize"
    # serialize: arg from get_public (k/pk/t) → PublicKey; from get_private (k1/pk1/t1) → PrivateKey.
    - regex: 'KeySerdeInst\.serialize(\s+)(k|pk|t)\b'
      replace: 'PublicKey.serialize$1$2'
    - regex: 'KeySerdeInst\.serialize(\s+)(k1|pk1|t1)\b'
      replace: 'PrivateKey.serialize$1$2'

    # Forward-reference (a SECOND, distinct Aeneas bug): the combining `@[reducible]`
    # GenericSignedPreKey trait instance is emitted AFTER the method defs that
    # reference it, so projections of its parent-clause / convert fields
    # (`<Instance>.KeyPairSerdeInst`, `.coreconvert{From,Into}Self_IdU32Inst`) are
    # "Unknown constant". Fix: replace each forward projection with the field's
    # DIRECT value (which is defined earlier in the file). NOTE: the bare instance
    # passed to deserialize's map_err closure can't be substituted this way (it needs
    # the whole instance, i.e. a reorder) — that one is handled separately.
    # (No upstream issue found for the instance-after-methods ordering; describe here.)
    - find: "state.kyber_prekey.KyberPreKeyRecord.Insts.Libsignal_protocolStateSigned_prekeyGenericSignedPreKeyKeyPairKyberPreKeyIdKeyPublicKeySecret.KeyPairSerdeInst"
      replace: "kem.KeyPair.Insts.Libsignal_protocolStateSigned_prekeyKeyPairSerdeKeyPublicKeySecret"
    - find: "state.signed_prekey.SignedPreKeyRecord.Insts.Libsignal_protocolStateSigned_prekeyGenericSignedPreKeyKeyPairSignedPreKeyIdPublicKeyPrivateKey.KeyPairSerdeInst"
      replace: "libsignal_core.curve.KeyPair.Insts.Libsignal_protocolStateSigned_prekeyKeyPairSerdePublicKeyPrivateKey"
    - find: "state.kyber_prekey.KyberPreKeyRecord.Insts.Libsignal_protocolStateSigned_prekeyGenericSignedPreKeyKeyPairKyberPreKeyIdKeyPublicKeySecret.coreconvertFromSelf_IdU32Inst"
      replace: "state.kyber_prekey.KyberPreKeyId.Insts.CoreConvertFromU32"
    - find: "state.signed_prekey.SignedPreKeyRecord.Insts.Libsignal_protocolStateSigned_prekeyGenericSignedPreKeyKeyPairSignedPreKeyIdPublicKeyPrivateKey.coreconvertFromSelf_IdU32Inst"
      replace: "state.signed_prekey.SignedPreKeyId.Insts.CoreConvertFromU32"
    - find: "state.kyber_prekey.KyberPreKeyRecord.Insts.Libsignal_protocolStateSigned_prekeyGenericSignedPreKeyKeyPairKyberPreKeyIdKeyPublicKeySecret.coreconvertIntoSelf_IdU32Inst"
      replace: "(core.convert.IntoFrom U32.Insts.CoreConvertFromKyberPreKeyId)"
    - find: "state.signed_prekey.SignedPreKeyRecord.Insts.Libsignal_protocolStateSigned_prekeyGenericSignedPreKeyKeyPairSignedPreKeyIdPublicKeyPrivateKey.coreconvertIntoSelf_IdU32Inst"
      replace: "(core.convert.IntoFrom U32.Insts.CoreConvertFromSignedPreKeyId)"

    # Namespace/parameter shadowing: a fn parameter named like a module
    # (`identity_key`, `timestamp`, `state`) shadows that module, so Aeneas's
    # fully-qualified `module.Type.method` references parse as field-projection on
    # the parameter and fail ("Invalid field …"). Fix: force root resolution by
    # qualifying the affected type-paths with `_root_.libsignal_protocol.…` (harmless
    # where there is no shadowing param — resolves to the same name). Targeted at the
    # broken USES only — return types (the `Result ` prefix) and method calls (a
    # trailing arg) — so they never match `def`/`structure` declaration names.
    # https://github.com/AeneasVerif/aeneas/issues/1098
    # -- identity_key (param shadows module in IdentityKeyPair::new, PreKeySignalMessage::new)
    - find: "Result identity_key.IdentityKeyPair"
      replace: "Result _root_.libsignal_protocol.identity_key.IdentityKeyPair"
    - find: "identity_key.IdentityKeyPair.new identity_key"
      replace: "_root_.libsignal_protocol.identity_key.IdentityKeyPair.new identity_key"
    - find: "identity_key.IdentityKey.serialize identity_key"
      replace: "_root_.libsignal_protocol.identity_key.IdentityKey.serialize identity_key"
    # -- timestamp (param/local shadows module in Timestamp/KyberPreKeyRecord/SignedPreKeyRecord fns)
    - find: "timestamp.Timestamp.epoch_millis timestamp"
      replace: "_root_.libsignal_protocol.timestamp.Timestamp.epoch_millis timestamp"
    - find: "timestamp.Timestamp.from_epoch_millis i"
      replace: "_root_.libsignal_protocol.timestamp.Timestamp.from_epoch_millis i"
    # -- state (param shadows module in SessionState setters + apply_to_session_state)
    - find: "Result state.session.SessionState"
      replace: "Result _root_.libsignal_protocol.state.session.SessionState"
    - find: "state.session.SessionState.set_sender_chain_key state"
      replace: "_root_.libsignal_protocol.state.session.SessionState.set_sender_chain_key state"
    - find: "state.session.SessionState.set_pq_ratchet_state state1"
      replace: "_root_.libsignal_protocol.state.session.SessionState.set_pq_ratchet_state state1"
    - find: "state.session.SessionState.apply_ratchet_state state"
      replace: "_root_.libsignal_protocol.state.session.SessionState.apply_ratchet_state state"

    # `&mut T` DerefMut model has one writeback too many: Aeneas emits the external
    # axiom `Mut0T...deref_mut : T → Result (T × (T → T) × (T → T))` (two back-fns)
    # but the DerefMut trait field expects `T → Result (T × (T → T))` (one back-fn,
    # like Box/Vec's `(x, fun x => x)`). The `&mut` in the type parameter adds the
    # spurious extra writeback. Correct the axiom's type to the trait's shape. This
    # fixes BOTH the standalone instance (Funs DerefMut) AND any fn threading `&mut R`
    # (RNG) through opaqued crypto, e.g. pqxdh_initiate's encapsulate(&mut csprng) —
    # keeping pqxdh_initiate TRANSPARENT. https://github.com/AeneasVerif/aeneas/issues/961
    - find: "Result (T × (T → T) × (T → T))"
      replace: "Result (T × (T → T))"

    # #961 (call-site manifestation), REVERT WHEN FIXED UPSTREAM. pqxdh_initiate calls
    # `encapsulate(&mut csprng)`; Aeneas wraps the RNG in `CryptoRng.Blanket (… DerefMut R)`
    # and destructures a TRIPLE `(r, csprng1, encapsulate_back)` with a spurious `&mut`
    # writeback — but `kem.KeyPublic.encapsulate` takes `R` by value and returns a PAIR
    # `(result × R)`, so destructuring 3 from 2 gives "expected a product type, got R" (3059).
    # Calculated correct form: pass the CryptoRng instance directly, destructure a pair,
    # and use the returned `csprng1` (which IS the writeback) — dropping `encapsulate_back`.
    # This rewrites pqxdh_initiate's body (verification target), so REVERT once
    # https://github.com/AeneasVerif/aeneas/issues/961 lands (regeneration will be correct).
    - regex: '\(rand_core_1\.CryptoRng\.Blanket\s+\(Mut0T\.Insts\.CoreOpsDerefDerefMut R\) rand_core_1CryptoRngInst\)'
      replace: 'rand_core_1CryptoRngInst'
    - find: "(r3, csprng1, encapsulate_back)"
      replace: "(r3, csprng1)"
    - find: "(r4, csprng1, encapsulate_back)"
      replace: "(r4, csprng1)"
    - find: "encapsulate_back csprng1"
      replace: "csprng1"

    # `core.ops.deref.DerefVec` has an IMPLICIT type param in the Aeneas base
    # (`DerefVec {T : Type} : Deref (Vec T) (Slice T)`), but Aeneas emits the call
    # with the type applied EXPLICITLY (`DerefVec Std.U8`) → "Function expected at
    # DerefVec". `@`-qualify so the implicit arg may be supplied explicitly. Relevant
    # (generate_keys, reached from triple_ratchet). Aeneas implicit/explicit-arg codegen bug.
    - find: "(core.ops.deref.DerefVec Std.U8)"
      replace: "(@core.ops.deref.DerefVec Std.U8)"
